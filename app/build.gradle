plugins {
    id 'com.android.application' version '8.1.0'
}
android {
    namespace 'com.dollarsplay.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.dollarsplay.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
